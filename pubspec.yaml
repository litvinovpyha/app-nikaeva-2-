name: app

description: "NIKAEVA APP"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  rive: ^0.12.4
  flutter_svg: ^2.2.4
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  equatable: ^2.0.8
  image_picker: ^1.2.1
  font_awesome_flutter: ^11.0.0
  url_launcher: ^6.3.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true


  assets:
    - assets/avatars/
    - assets/
    - assets/Backgrounds/
    - assets/icons/
    - assets/RiveAssets/
  fonts:
    - family: Intel
      fonts:
        - asset: assets/Fonts/Inter-Regular.ttf
        - asset: assets/Fonts/Inter-SemiBold.ttf
          weight: 600
    - family: Poppins
      fonts:
        - asset: assets/Fonts/Poppins-Bold.ttf
          weight: 700
  #